# .github/workflows/release.yml
name: Build & Release

on:
  push:
    tags: [ 'v*' ]          # <-- only on tags that start with v

jobs:
  build:
    strategy:
      matrix:
        include:
          - python: "3.8"
            arch: "x86"
            name: kiyabo32
            spec: build_32.spec
          - python: "3.8"
            arch: "x64"
            name: kiyabo64
            spec: build_64.spec
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.arch }}

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build ${{ matrix.name }}
        run: python -m PyInstaller --noconfirm ${{ matrix.spec }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create / Overwrite Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}   # e.g. v1.0.0
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            artifacts/kiyabo32/kiyabo32.exe
            artifacts/kiyabo64/kiyabo64.exe