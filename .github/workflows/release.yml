# .github/workflows/release.yml
name: Build & Release

on:
  push:
    tags: [ 'v*' ]

jobs:
  build:
    strategy:
      matrix:
        include:
          - python: "3.8"
            arch: "x86"
            name: kiyabo32
            spec: build_32.spec
          - python: "3.8"
            arch: "x64"
            name: kiyabo64
            spec: build_64.spec
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.arch }}

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build ${{ matrix.name }}
        run: python -m PyInstaller --noconfirm ${{ matrix.spec }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}.exe

  generate-notes:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - name: Download Template
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/RELEASE_TEMPLATE.md

      - name: Generate Release Notes
        id: notes
        run: |
          if [ -f ".github/RELEASE_TEMPLATE.md" ]; then
            NOTES=$(cat .github/RELEASE_TEMPLATE.md)
          else
            NOTES="## v${{ github.ref_name }}\n\n- Automated build\n- 32-bit and 64-bit executables\n"
          fi
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  release:
    needs: [build, generate-notes]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Compute SHA256 Hashes
        run: |
          cd artifacts
          echo "## SHA256 Hashes" > hashes.txt
          echo "\`\`\`" >> hashes.txt
          sha256sum kiyabo32/kiyabo32.exe | awk '{print "kiyabo32.exe: " $1}' >> hashes.txt
          sha256sum kiyabo64/kiyabo64.exe | awk '{print "kiyabo64.exe: " $1}' >> hashes.txt
          echo "\`\`\`" >> hashes.txt
          cat hashes.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Kiyabo CLI ${{ github.ref_name }}
          body: |
            ${{ needs.generate-notes.outputs.notes }}

            $(cat artifacts/hashes.txt)
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            artifacts/kiyabo32/kiyabo32.exe
            artifacts/kiyabo64/kiyabo64.exe