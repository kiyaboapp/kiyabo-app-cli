on:
  push:
    tags: [ 'v*' ]
jobs:
  build:
    strategy:
      matrix:
        include:
          - python: "3.8"; arch: "x86"; name: kiyabo32; spec: build_32.spec
          - python: "3.8"; arch: "x64"; name: kiyabo64; spec: build_64.spec
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.arch }}
      - run: python -m pip install pyinstaller
      - run: python -m PyInstaller --noconfirm ${{ matrix.spec }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}.exe
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            kiyabo32/kiyabo32.exe
            kiyabo64/kiyabo64.exe